name: kafka-de-learning

services:
  broker:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    hostname: broker
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: >-
        CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://broker:19092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server localhost:9092
          --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  topic-init:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
    command: ["/bin/bash", "/scripts/create-topics.sh"]
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ./config:/config:ro
      - ./scripts:/scripts:ro
    restart: "no"

  postgres:
    image: postgres:${POSTGRES_VERSION:-18.4}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kafka_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-kafka_learning}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U ${POSTGRES_USER:-kafka_user}
          -d ${POSTGRES_DB:-kafka_learning}
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/migrations:/docker-entrypoint-initdb.d:ro

  app:
    build:
      context: .
      args:
        PYTHON_IMAGE_TAG: ${PYTHON_IMAGE_TAG:-3.14.6-slim}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-kafka-de-learning-v1}
      POSTGRES_DSN: >-
        postgresql://${POSTGRES_USER:-kafka_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kafka_learning}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: ["sleep", "infinity"]
    depends_on:
      topic-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  kafka_data:
  postgres_data:
